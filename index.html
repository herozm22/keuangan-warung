<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungPro - Dashboard Keuangan & Bon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input, textarea { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        .chart-container { position: relative; height: 280px; width: 100%; }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-20">

    <div id="modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card w-full max-w-sm p-6 rounded-3xl border border-blue-500/30 shadow-2xl">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 text-blue-400">Tambah Data</h2>
            <div class="space-y-4">
                <input type="text" id="desc" class="w-full p-4 rounded-2xl outline-none" placeholder="Keterangan / Nama Pelanggan">
                <textarea id="detail" class="w-full p-4 rounded-2xl outline-none hidden" rows="2" placeholder="Detail Pesanan (misal: Beras 2kg, Telur 1/2kg)"></textarea>
                <input type="number" id="amount" class="w-full p-4 rounded-2xl outline-none" placeholder="Total Jumlah (Rp)">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 p-4 rounded-2xl bg-slate-700 font-bold">Batal</button>
                    <button onclick="saveData()" class="flex-1 p-4 rounded-2xl bg-blue-600 font-bold shadow-lg shadow-blue-500/20">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center border-b border-slate-800 sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-10">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">WarungPro</h1>
        <div class="flex gap-4">
            <button onclick="showTab('transaksi')" id="btnTabTrans" class="text-xs font-bold tab-active py-1">KEUANGAN</button>
            <button onclick="showTab('bon')" id="btnTabBon" class="text-xs font-bold text-slate-500 py-1">CATATAN BON</button>
        </div>
    </header>

    <main class="p-4 max-w-5xl mx-auto space-y-6">
        
        <div id="section-transaksi" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                <div class="glass-card p-5 rounded-2xl border-b-2 border-emerald-500/50">
                    <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest">Pemasukan</p>
                    <h3 id="totalIn" class="text-2xl font-bold text-emerald-400 mt-1 italic">Rp 0</h3>
                </div>
                <div class="glass-card p-5 rounded-2xl border-b-2 border-rose-500/50">
                    <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest">Pengeluaran</p>
                    <h3 id="totalOut" class="text-2xl font-bold text-rose-400 mt-1 italic">Rp 0</h3>
                </div>
                <div class="glass-card p-5 rounded-2xl border-b-2 border-blue-500">
                    <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest">Saldo Bersih</p>
                    <h3 id="balance" class="text-2xl font-bold text-blue-400 mt-1 italic">Rp 0</h3>
                </div>
            </div>

            <div class="glass-card p-6 rounded-3xl overflow-hidden">
                <div class="chart-container">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="openModal('income')" class="bg-emerald-600 p-3 rounded-xl text-[10px] font-bold shadow-lg shadow-emerald-500/20 uppercase">+ Masuk</button>
                <button onclick="openModal('expense')" class="bg-rose-600 p-3 rounded-xl text-[10px] font-bold shadow-lg shadow-rose-500/20 uppercase">- Keluar</button>
                <button onclick="openModal('salary')" class="bg-blue-600 p-3 rounded-xl text-[10px] font-bold shadow-lg shadow-blue-500/20 uppercase">👤 Gaji</button>
                <button onclick="openModal('bon')" class="bg-orange-500 p-3 rounded-xl text-[10px] font-bold text-black uppercase">📒 Catat Bon</button>
            </div>

            <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
                <div id="historyList" class="divide-y divide-slate-800"></div>
            </div>
        </div>

        <div id="section-bon" class="space-y-4 hidden">
            <h2 class="text-xl font-bold text-orange-400 px-2">Daftar Hutang Pelanggan</h2>
            <div id="bonList" class="space-y-4"></div>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('warungV5')) || { trans: [], bon: [] };
        let currentType = '';
        let myChart = null;

        function showTab(tab) {
            document.getElementById('section-transaksi').classList.toggle('hidden', tab !== 'transaksi');
            document.getElementById('section-bon').classList.toggle('hidden', tab !== 'bon');
            document.getElementById('btnTabTrans').className = tab === 'transaksi' ? 'text-xs font-bold tab-active py-1' : 'text-xs font-bold text-slate-500 py-1';
            document.getElementById('btnTabBon').className = tab === 'bon' ? 'text-xs font-bold tab-active py-1' : 'text-xs font-bold text-slate-500 py-1';
        }

        function openModal(type) {
            currentType = type;
            document.getElementById('detail').classList.toggle('hidden', type !== 'bon');
            document.getElementById('modalTitle').innerText = type === 'bon' ? 'Catat Hutang Pelanggan' : 'Input Transaksi';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('detail').value = '';
        }

        function saveData() {
            const desc = document.getElementById('desc').value;
            const amount = parseInt(document.getElementById('amount').value);
            const detail = document.getElementById('detail').value;
            
            if(!desc || !amount) return alert('Keterangan & Jumlah harus diisi!');

            const entry = { 
                id: Date.now(), 
                desc, 
                amount, 
                detail, 
                date: new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short'}) 
            };

            if(currentType === 'bon') {
                db.bon.unshift(entry);
            } else {
                entry.type = currentType;
                db.trans.unshift(entry);
            }

            saveToLocalStorage();
            closeModal();
            render();
        }

        function lunasBon(id) {
            const idx = db.bon.findIndex(b => b.id === id);
            const item = db.bon[idx];
            db.trans.unshift({ ...item, type: 'income', desc: 'LUNAS: ' + item.desc });
            db.bon.splice(idx, 1);
            saveToLocalStorage();
            render();
        }

        function deleteItem(type, id) {
            db[type] = db[type].filter(i => i.id !== id);
            saveToLocalStorage();
            render();
        }

        function saveToLocalStorage() {
            localStorage.setItem('warungV5', JSON.stringify(db));
        }

        function render() {
            const hList = document.getElementById('historyList');
            const bList = document.getElementById('bonList');
            let tIn = 0, tOut = 0;
            
            // Render Transaksi
            hList.innerHTML = db.trans.length === 0 ? '<p class="p-6 text-center text-slate-600 italic">Belum ada transaksi</p>' : '';
            db.trans.forEach(t => {
                const isInc = t.type === 'income';
                if(isInc) tIn += t.amount; else tOut += t.amount;
                hList.innerHTML += `
                    <div class="p-4 flex justify-between items-center bg-slate-800/20">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg ${isInc?'bg-emerald-500/10 text-emerald-400':'bg-rose-500/10 text-rose-400'} text-xs font-bold uppercase tracking-widest">${t.type.slice(0,2)}</div>
                            <div><p class="text-sm font-bold text-slate-200">${t.desc}</p><p class="text-[10px] text-slate-500 uppercase">${t.date}</p></div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${isInc?'text-emerald-400':'text-rose-400'}">${isInc?'+':'-'} Rp ${t.amount.toLocaleString()}</p>
                            <button onclick="deleteItem('trans', ${t.id})" class="text-[9px] text-rose-500/50 hover:text-rose-500 font-bold uppercase">Hapus</button>
                        </div>
                    </div>`;
            });

            // Render Bon
            bList.innerHTML = db.bon.length === 0 ? '<p class="text-center text-slate-600 py-10 italic">Tidak ada catatan hutang</p>' : '';
            db.bon.forEach(b => {
                bList.innerHTML += `
                    <div class="glass-card p-4 rounded-3xl border-l-4 border-orange-500">
                        <div class="flex justify-between items-start mb-2">
                            <div><p class="font-bold text-orange-400 text-lg">${b.desc}</p><p class="text-[10px] text-slate-500 uppercase tracking-widest">${b.date}</p></div>
                            <p class="font-bold text-xl text-slate-100">Rp ${b.amount.toLocaleString()}</p>
                        </div>
                        <div class="text-xs text-slate-400 bg-black/30 p-3 rounded-2xl mb-4 border border-slate-700 italic">Pesanan: ${b.detail || 'Tidak ada detail'}</div>
                        <div class="flex gap-2">
                            <button onclick="lunasBon(${b.id})" class="flex-1 bg-emerald-600 text-[10px] font-bold py-3 rounded-xl uppercase text-white shadow-lg">Lunas & Masuk Kas</button>
                            <button onclick="deleteItem('bon', ${b.id})" class="bg-slate-800 text-slate-500 p-3 rounded-xl">🗑</button>
                        </div>
                    </div>`;
            });

            document.getElementById('totalIn').innerText = 'Rp ' + tIn.toLocaleString();
            document.getElementById('totalOut').innerText = 'Rp ' + tOut.toLocaleString();
            document.getElementById('balance').innerText = 'Rp ' + (tIn - tOut).toLocaleString();
            
            updateChart(db.trans);
        }

        function updateChart(trans) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if(myChart) myChart.destroy();

            // Ambil 7 transaksi terakhir buat grafik
            const recent = trans.slice(0, 7).reverse();
            const labels = recent.map(t => t.date);
            const dataIn = recent.map(t => t.type === 'income' ? t.amount : 0);
            const dataOut = recent.map(t => t.type !== 'income' ? t.amount : 0);

            const gradIn = ctx.createLinearGradient(0, 0, 0, 300);
            gradIn.addColorStop(0, 'rgba(16, 185, 129, 0.2)');
            gradIn.addColorStop(1, 'transparent');

            const gradOut = ctx.createLinearGradient(0, 0, 0, 300);
            gradOut.addColorStop(0, 'rgba(244, 63, 94, 0.2)');
            gradOut.addColorStop(1, 'transparent');

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : ['Sen','Sel','Rab','Kam','Jum','Sab','Min'],
                    datasets: [
                        { label: 'Masuk', data: dataIn, borderColor: '#10b981', backgroundColor: gradIn, fill: true, tension: 0.4, borderWidth: 3, pointRadius: 2 },
                        { label: 'Keluar', data: dataOut, borderColor: '#f43f5e', backgroundColor: gradOut, fill: true, tension: 0.4, borderWidth: 3, pointRadius: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, labels: { color: '#64748b', font: {size: 10} } } },
                    scales: {
                        y: { display: false },
                        x: { ticks: { color: '#475569', font: {size: 10} }, grid: { display: false } }
                    }
                }
            });
        }

        render();
    </script>
</body>
    </html>
