<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungPro Premium - Catatan Keuangan & Bon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f1a; color: #e2e8f0; }
        .glass { background: rgba(23, 30, 48, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-dark { background: #161d2f !important; border: 1px solid #2d3748 !important; color: white !important; }
        
        /* Animasi Masuk */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: slideUp 0.4s ease-out forwards; }
        
        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 10px; }
    </style>
</head>
<body class="pb-24">

    <div id="modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="glass w-full max-w-md p-8 rounded-[2rem] shadow-2xl animate-in">
            <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-blue-400">Tambah Data</h2>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs text-slate-500 ml-2 font-bold uppercase">Keterangan</label>
                    <input type="text" id="desc" class="input-dark w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Contoh: Jual Telur / Nama Orang">
                </div>
                <div id="detailBox" class="space-y-1 hidden">
                    <label class="text-xs text-slate-500 ml-2 font-bold uppercase">Detail Pesanan (BON)</label>
                    <textarea id="detail" class="input-dark w-full p-4 rounded-2xl outline-none" rows="2" placeholder="Detail barang yang dibon..."></textarea>
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-500 ml-2 font-bold uppercase">Jumlah Uang (Rp)</label>
                    <input type="number" id="amount" class="input-dark w-full p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="0">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 p-4 rounded-2xl bg-slate-800 font-bold hover:bg-slate-700 transition">Batal</button>
                    <button onclick="saveData()" class="flex-1 p-4 rounded-2xl bg-blue-600 font-bold shadow-lg shadow-blue-500/40 hover:scale-105 transition">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-40 bg-[#0b0f1a]/80 backdrop-blur-md border-b border-slate-800 p-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent italic">WARUNG PRO</h1>
                <p id="dateDisplay" class="text-[10px] text-slate-500 font-bold tracking-[0.2em] uppercase"></p>
            </div>
            <button onclick="if(confirm('Reset semua data?')) { localStorage.clear(); location.reload(); }" class="p-3 rounded-2xl bg-rose-500/10 text-rose-500 border border-rose-500/20 hover:bg-rose-500 hover:text-white transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor font-bold"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>
        </div>
    </nav>

    <main class="max-w-xl mx-auto p-4 space-y-6">
        <div class="glass p-8 rounded-[2.5rem] shadow-xl relative overflow-hidden animate-in">
            <div class="absolute top-0 right-0 p-8 opacity-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <p class="text-slate-400 text-sm font-semibold mb-1 uppercase tracking-widest">Saldo Bersih Saat Ini</p>
            <h2 id="balance" class="text-4xl font-black text-white">Rp 0</h2>
            <div class="flex gap-4 mt-8 pt-6 border-t border-slate-800">
                <div class="flex-1">
                    <p class="text-[10px] text-emerald-500 font-bold uppercase mb-1">Masuk</p>
                    <p id="totalIn" class="text-lg font-bold text-white">Rp 0</p>
                </div>
                <div class="w-[1px] bg-slate-800"></div>
                <div class="flex-1">
                    <p class="text-[10px] text-rose-500 font-bold uppercase mb-1">Keluar</p>
                    <p id="totalOut" class="text-lg font-bold text-white">Rp 0</p>
                </div>
            </div>
        </div>

        <div class="flex p-1 bg-slate-900 rounded-2xl animate-in" style="animation-delay: 0.1s">
            <button onclick="switchTab('kas')" id="tabKas" class="flex-1 py-3 rounded-xl font-bold text-sm transition bg-blue-600 text-white shadow-lg">CATATAN KAS</button>
            <button onclick="switchTab('bon')" id="tabBon" class="flex-1 py-3 rounded-xl font-bold text-sm transition text-slate-500">DAFTAR BON</button>
        </div>

        <div id="contentKas" class="space-y-4 animate-in" style="animation-delay: 0.2s">
            <div id="kasList" class="space-y-3"></div>
        </div>

        <div id="contentBon" class="space-y-4 hidden animate-in">
            <div id="bonList" class="space-y-4"></div>
        </div>
    </main>

    <div class="fixed bottom-6 left-0 right-0 px-6 z-40 max-w-xl mx-auto flex gap-3">
        <button onclick="openModal('income')" class="flex-1 bg-emerald-600 h-14 rounded-2xl flex items-center justify-center font-bold shadow-xl shadow-emerald-900/40 hover:scale-105 transition">+ MASUK</button>
        <button onclick="openModal('expense')" class="flex-1 bg-rose-600 h-14 rounded-2xl flex items-center justify-center font-bold shadow-xl shadow-rose-900/40 hover:scale-105 transition">- KELUAR</button>
        <button onclick="openModal('bon')" class="w-20 bg-orange-500 h-14 rounded-2xl flex items-center justify-center shadow-xl shadow-orange-900/40 hover:scale-105 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor font-bold"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.168.477-4.5 1.253" /></svg>
        </button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('WarungProVFinal')) || { kas: [], bon: [] };
        let activeType = '';

        // Tampilkan Tanggal
        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        function switchTab(tab) {
            const isKas = tab === 'kas';
            document.getElementById('contentKas').classList.toggle('hidden', !isKas);
            document.getElementById('contentBon').classList.toggle('hidden', isKas);
            document.getElementById('tabKas').className = isKas ? 'flex-1 py-3 rounded-xl font-bold text-sm transition bg-blue-600 text-white shadow-lg' : 'flex-1 py-3 rounded-xl font-bold text-sm transition text-slate-500';
            document.getElementById('tabBon').className = !isKas ? 'flex-1 py-3 rounded-xl font-bold text-sm transition bg-orange-500 text-black shadow-lg' : 'flex-1 py-3 rounded-xl font-bold text-sm transition text-slate-500';
        }

        function openModal(type) {
            activeType = type;
            document.getElementById('detailBox').classList.toggle('hidden', type !== 'bon');
            document.getElementById('modalTitle').innerText = type === 'income' ? 'Pemasukan Baru' : (type === 'bon' ? 'Catat Bon Baru' : 'Pengeluaran Baru');
            document.getElementById('modalTitle').className = `text-2xl font-bold mb-6 ${type==='income'?'text-emerald-400':(type==='bon'?'text-orange-400':'text-rose-400')}`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('detail').value = '';
        }

        function saveData() {
            const d = document.getElementById('desc').value;
            const a = parseInt(document.getElementById('amount').value);
            const dt = document.getElementById('detail').value;
            if(!d || !a) return alert('Data tidak lengkap!');

            const item = { id: Date.now(), d, a, dt, date: new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short'}) };

            if(activeType === 'bon') db.bon.unshift(item);
            else { item.type = activeType; db.kas.unshift(item); }

            save();
        }

        function lunas(id) {
            const idx = db.bon.findIndex(x => x.id === id);
            const item = db.bon[idx];
            db.kas.unshift({ ...item, type: 'income', d: 'LUNAS: ' + item.d });
            db.bon.splice(idx, 1);
            save();
        }

        function del(category, id) {
            db[category] = db[category].filter(x => x.id !== id);
            save();
        }

        function save() {
            localStorage.setItem('WarungProVFinal', JSON.stringify(db));
            closeModal();
            render();
        }

        function render() {
            let tin = 0, tout = 0, kHtml = '', bHtml = '';
            
            db.kas.forEach(x => {
                const isIn = x.type === 'income';
                if(isIn) tin += x.a; else tout += x.a;
                kHtml += `
                    <div class="glass p-5 rounded-[1.5rem] flex justify-between items-center animate-in">
                        <div class="flex items-center gap-4">
                            <div class="h-12 w-12 rounded-2xl flex items-center justify-center font-bold ${isIn?'bg-emerald-500/10 text-emerald-400':'bg-rose-500/10 text-rose-400'}">${isIn?'↓':'↑'}</div>
                            <div>
                                <p class="font-bold text-white">${x.d}</p>
                                <p class="text-[10px] text-slate-500 font-bold uppercase">${x.date}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-black ${isIn?'text-emerald-400':'text-rose-400'}">${isIn?'+':'-'} Rp ${x.a.toLocaleString()}</p>
                            <button onclick="del('kas', ${x.id})" class="text-[10px] text-slate-600 font-bold uppercase tracking-tighter">Hapus</button>
                        </div>
                    </div>`;
            });

            db.bon.forEach(x => {
                bHtml += `
                    <div class="glass p-6 rounded-[2rem] border-l-4 border-orange-500 animate-in">
                        <div class="flex justify-between items-start mb-4">
                            <div><h4 class="text-xl font-black text-orange-400">${x.d}</h4><p class="text-[10px] text-slate-500 font-bold uppercase">${x.date}</p></div>
                            <p class="text-2xl font-black text-white italic">Rp ${x.a.toLocaleString()}</p>
                        </div>
                        <div class="bg-black/20 p-4 rounded-2xl text-sm text-slate-300 mb-6 border border-white/5">${x.dt || 'Tidak ada detail barang'}</div>
                        <div class="flex gap-2">
                            <button onclick="lunas(${x.id})" class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold text-xs shadow-lg shadow-emerald-900/40">TANDAI LUNAS</button>
                            <button onclick="del('bon', ${x.id})" class="bg-slate-800 px-4 rounded-xl text-slate-500 text-xs">HAPUS</button>
                        </div>
                    </div>`;
            });

            document.getElementById('kasList').innerHTML = kHtml || '<p class="text-center text-slate-600 py-10">Belum ada catatan kas</p>';
            document.getElementById('bonList').innerHTML = bHtml || '<p class="text-center text-slate-600 py-10">Semua hutang lunas! Luar biasa.</p>';
            document.getElementById('totalIn').innerText = 'Rp ' + tin.toLocaleString();
            document.getElementById('totalOut').innerText = 'Rp ' + tout.toLocaleString();
            document.getElementById('balance').innerText = 'Rp ' + (tin - tout).toLocaleString();
        }

        render();
    </script>
</body>
</html>
