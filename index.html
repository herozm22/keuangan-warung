<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungPro V.Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f1a; color: #e2e8f0; }
        .glass { background: rgba(23, 30, 48, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-dark { background: #161d2f !important; border: 1px solid #2d3748 !important; color: white !important; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="pb-28">

    <div id="modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="glass w-full max-w-md p-8 rounded-[2rem] animate-in">
            <h2 id="modalTitle" class="text-2xl font-extrabold mb-6">Tambah Data</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase ml-2">Nama / Keterangan</label>
                    <input type="text" id="desc" class="input-dark w-full p-4 rounded-2xl outline-none" placeholder="Isi keterangan...">
                </div>
                <div id="detailBox" class="hidden">
                    <label class="text-[10px] text-slate-500 font-bold uppercase ml-2">Detail Pesanan (BON)</label>
                    <textarea id="detail" class="input-dark w-full p-4 rounded-2xl outline-none" rows="2" placeholder="Contoh: Beras 2kg, Telur 1kg..."></textarea>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase ml-2">Jumlah Uang (Rp)</label>
                    <input type="number" id="amount" class="input-dark w-full p-4 rounded-2xl outline-none" placeholder="0">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 p-4 rounded-2xl bg-slate-800 font-bold">BATAL</button>
                    <button onclick="saveData()" class="flex-1 p-4 rounded-2xl bg-blue-600 font-bold shadow-lg shadow-blue-500/30">SIMPAN</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-40 bg-[#0b0f1a]/90 backdrop-blur-md border-b border-slate-800 p-5 px-6">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">WARUNG PRO</h1>
                <p id="dateDisplay" class="text-[9px] text-slate-500 font-bold tracking-widest uppercase"></p>
            </div>
            <button onclick="if(confirm('Hapus semua data?')) { localStorage.clear(); location.reload(); }" class="bg-rose-500/10 text-rose-500 border border-rose-500/20 px-3 py-2 rounded-xl text-[10px] font-bold">
                🗑️ RESET
            </button>
        </div>
    </nav>

    <main class="max-w-xl mx-auto p-4 space-y-6">
        <div class="glass p-8 rounded-[2.5rem] shadow-xl animate-in">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Saldo Bersih</p>
            <h2 id="balance" class="text-4xl font-black text-white">Rp 0</h2>
            <div class="flex gap-4 mt-8 pt-6 border-t border-slate-800">
                <div class="flex-1 text-center">
                    <p class="text-[9px] text-emerald-500 font-bold uppercase mb-1">Total Masuk</p>
                    <p id="totalIn" class="text-base font-bold text-white">Rp 0</p>
                </div>
                <div class="flex-1 text-center border-l border-slate-800">
                    <p class="text-[9px] text-rose-500 font-bold uppercase mb-1">Total Keluar</p>
                    <p id="totalOut" class="text-base font-bold text-white">Rp 0</p>
                </div>
            </div>
        </div>

        <div class="flex p-1 bg-slate-900/50 rounded-2xl animate-in">
            <button onclick="switchTab('kas')" id="tabKas" class="flex-1 py-3 rounded-xl font-bold text-xs transition bg-blue-600 text-white shadow-lg">KEUANGAN</button>
            <button onclick="switchTab('bon')" id="tabBon" class="flex-1 py-3 rounded-xl font-bold text-xs transition text-slate-500 uppercase">Daftar Bon</button>
        </div>

        <div id="contentKas" class="space-y-3 animate-in">
            <div id="kasList" class="space-y-3"></div>
        </div>

        <div id="contentBon" class="space-y-4 hidden animate-in">
            <div id="bonList" class="space-y-4"></div>
        </div>
    </main>

    <div class="fixed bottom-6 left-0 right-0 px-6 z-40 max-w-xl mx-auto flex gap-2">
        <button onclick="openModal('income')" class="flex-1 bg-emerald-600 h-14 rounded-2xl flex items-center justify-center font-extrabold text-[10px] shadow-xl shadow-emerald-900/40">+ MASUK</button>
        <button onclick="openModal('expense')" class="flex-1 bg-rose-600 h-14 rounded-2xl flex items-center justify-center font-extrabold text-[10px] shadow-xl shadow-rose-900/40">- KELUAR</button>
        <button onclick="openModal('bon')" class="flex-1 bg-orange-500 h-14 rounded-2xl flex flex-col items-center justify-center shadow-xl shadow-orange-900/40 text-black">
            <span class="text-xs">📒</span>
            <span class="text-[10px] font-black uppercase">BON</span>
        </button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('WarungPro_Final_V1')) || { kas: [], bon: [] };
        let activeType = '';

        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });

        function switchTab(tab) {
            const isKas = tab === 'kas';
            document.getElementById('contentKas').classList.toggle('hidden', !isKas);
            document.getElementById('contentBon').classList.toggle('hidden', isKas);
            document.getElementById('tabKas').className = isKas ? 'flex-1 py-3 rounded-xl font-bold text-xs transition bg-blue-600 text-white shadow-lg' : 'flex-1 py-3 rounded-xl font-bold text-xs transition text-slate-500';
            document.getElementById('tabBon').className = !isKas ? 'flex-1 py-3 rounded-xl font-bold text-xs transition bg-orange-500 text-black shadow-lg' : 'flex-1 py-3 rounded-xl font-bold text-xs transition text-slate-500 uppercase';
        }

        function openModal(type) {
            activeType = type;
            document.getElementById('detailBox').classList.toggle('hidden', type !== 'bon');
            document.getElementById('modalTitle').innerText = type === 'income' ? 'Uang Masuk' : (type === 'bon' ? 'Catat Hutang' : 'Uang Keluar');
            document.getElementById('modalTitle').className = `text-2xl font-black mb-6 ${type==='income'?'text-emerald-400':(type==='bon'?'text-orange-400':'text-rose-400')}`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('detail').value = '';
        }

        function saveData() {
            const d = document.getElementById('desc').value;
            const a = parseInt(document.getElementById('amount').value);
            const dt = document.getElementById('detail').value;
            if(!d || !a) return alert('Isi Nama & Jumlah!');

            const item = { id: Date.now(), d, a, dt, date: new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short'}) };

            if(activeType === 'bon') db.bon.unshift(item);
            else { item.type = activeType; db.kas.unshift(item); }

            save();
        }

        function lunas(id) {
            const idx = db.bon.findIndex(x => x.id === id);
            const item = db.bon[idx];
            db.kas.unshift({ ...item, type: 'income', d: 'LUNAS: ' + item.d });
            db.bon.splice(idx, 1);
            save();
            alert('Bon Lunas! Uang otomatis masuk ke Keuangan.');
        }

        function del(category, id) {
            if(confirm('Hapus data ini?')) {
                db[category] = db[category].filter(x => x.id !== id);
                save();
            }
        }

        function save() {
            localStorage.setItem('WarungPro_Final_V1', JSON.stringify(db));
            closeModal();
            render();
        }

        function render() {
            let tin = 0, tout = 0, kHtml = '', bHtml = '';
            
            db.kas.forEach(x => {
                const isIn = x.type === 'income';
                if(isIn) tin += x.a; else tout += x.a;
                kHtml += `
                    <div class="glass p-5 rounded-[1.5rem] flex justify-between items-center animate-in">
                        <div class="flex items-center gap-4">
                            <div class="h-10 w-10 rounded-xl flex items-center justify-center font-bold text-xs ${isIn?'bg-emerald-500/10 text-emerald-400':'bg-rose-500/10 text-rose-400'}">${isIn?'IN':'OUT'}</div>
                            <div>
                                <p class="font-bold text-white text-sm">${x.d}</p>
                                <p class="text-[9px] text-slate-500 font-bold uppercase">${x.date}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-extrabold text-sm ${isIn?'text-emerald-400':'text-rose-400'}">${isIn?'+':'-'} Rp ${x.a.toLocaleString()}</p>
                            <button onclick="del('kas', ${x.id})" class="text-[9px] text-slate-600 font-bold uppercase tracking-tighter">Hapus</button>
                        </div>
                    </div>`;
            });

            db.bon.forEach(x => {
                bHtml += `
                    <div class="glass p-6 rounded-[2rem] border-l-4 border-orange-500 animate-in">
                        <div class="flex justify-between items-start mb-4">
                            <div><h4 class="text-lg font-black text-orange-400">${x.d}</h4><p class="text-[9px] text-slate-500 font-bold uppercase">${x.date}</p></div>
                            <p class="text-xl font-black text-white italic">Rp ${x.a.toLocaleString()}</p>
                        </div>
                        <div class="bg-black/20 p-4 rounded-xl text-xs text-slate-300 mb-5 border border-white/5">${x.dt || 'Tanpa detail'}</div>
                        <div class="flex gap-2">
                            <button onclick="lunas(${x.id})" class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold text-[10px] text-white">LUNASKAN</button>
                            <button onclick="del('bon', ${x.id})" class="bg-slate-800 px-4 rounded-xl text-[10px] text-slate-500 font-bold">HAPUS</button>
                        </div>
                    </div>`;
            });

            document.getElementById('kasList').innerHTML = kHtml || '<p class="text-center text-slate-600 py-10 text-sm italic">Kosong</p>';
            document.getElementById('bonList').innerHTML = bHtml || '<p class="text-center text-slate-600 py-10 text-sm italic">Hutang Lunas Semua</p>';
            document.getElementById('totalIn').innerText = 'Rp ' + tin.toLocaleString();
            document.getElementById('totalOut').innerText = 'Rp ' + tout.toLocaleString();
            document.getElementById('balance').innerText = 'Rp ' + (tin - tout).toLocaleString();
        }

        render();
    </script>
</body>
</html>
